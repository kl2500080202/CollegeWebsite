
<!DOCTYPE html>
<html>
<head>
    <title>College Home Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>ABC College</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#courses">Courses</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<main>

    <section>
        <h2>Welcome to ABC College</h2>
        <p>We provide quality education for students.</p>
    </section>

    <section id="courses">
        <h2>Our Courses</h2>

        <table>
            <tr>
                <th>Course</th>
                <th>Duration</th>
                <th>Fees</th>
            </tr>
            <tr>
                <td>B.Tech</td>
                <td>4 Years</td>
                <td>100000</td>
            </tr>
            <tr>
                <td>MBA</td>
                <td>2 Years</td>
                <td>80000</td>
            </tr>
            <tr>
                <td>BCA</td>
                <td>3 Years</td>
                <td>60000</td>
            </tr>
        </table>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>

        <form id="myForm">
            <input type="text" placeholder="Enter Name" required>
            <input type="email" placeholder="Enter Email" required>
            <textarea placeholder="Enter Message"></textarea>
            <button type="submit">Submit</button>
        </form>
    </section>

</main>

<footer>
    <p>Copyright 2026 ABC College</p>
</footer>

<script src="script.js"></script>
</body>
</html>
